[project]
name = "coding-agent"
version = "0.1.0"
description = "A small local coding agent powered by the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.107.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]
